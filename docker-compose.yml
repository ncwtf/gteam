services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gteam
      POSTGRES_USER: gteam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gteam}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gteam"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-3000}:3000"
      - "${WS_BIND:-0.0.0.0}:${WS_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3000
      WS_PORT: 3001
      DATABASE_URL: postgresql://gteam:${POSTGRES_PASSWORD:-gteam}@postgres:5432/gteam
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SERVER_URL: ${SERVER_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional HTTPS. Started only with: docker compose --profile https up
  # scripts/install.sh adds the profile when HTTPS_ENABLED=1.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
