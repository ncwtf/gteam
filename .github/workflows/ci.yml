name: CI

on:
  # Branch pushes that already have a pull request would otherwise run this
  # workflow twice. Pull requests cover feature branches; push covers main and tags.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          desktop=true
          server=false
          changed="$(mktemp)"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_REF"
              base="FETCH_HEAD"
            fi
            git diff --name-only "$base" HEAD > "$changed"
            desktop=false
            if [ -s "$changed" ] && grep -Ev '^(docs/|scripts/|apps/server/)' "$changed" | grep -q .; then
              desktop=true
            fi
          elif [ "$REF" = "refs/heads/main" ]; then
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              server=true
              : > "$changed"
            else
              git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > "$changed"
            fi
          fi

          if [ -s "$changed" ] && grep -Eq '^(apps/server/|packages/shared/|pnpm-lock\.yaml$|(.*/)?docker-compose\.yml$|(.*/)?Dockerfile$)' "$changed"; then
            server=true
          fi

          {
            echo "desktop=$desktop"
            echo "server=$server"
          } >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop server=$server"
          echo "changed files:"
          cat "$changed"

  test:
    name: Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gteam_test
          POSTGRES_USER: gteam
          POSTGRES_PASSWORD: gteam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build packages
        run: pnpm build
      
      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://gteam:gteam@localhost:5432/gteam_test
      
      - name: Type check
        run: pnpm typecheck

  build-desktop:
    name: Build Desktop App
    needs: [changes]
    if: always() && !cancelled() && needs.changes.outputs.desktop != 'false'
    strategy:
      fail-fast: false
      # PRs and feature branches build Linux only; main and v* tags build every platform.
      matrix:
        include: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && '[{"platform":"macos-latest","target":"x86_64-apple-darwin"},{"platform":"macos-latest","target":"aarch64-apple-darwin"},{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"platform":"windows-latest","target":"x86_64-pc-windows-msvc"}]' || '[{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}]') }}
    
    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      # shared-key replaces the job id, so the same target reuses one cache on PRs and main.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: ${{ matrix.target }}
      
      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build packages
        run: pnpm build

      - name: Set next patch version
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git fetch --tags --force
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");
          const tags = execSync("git tag -l", { encoding: "utf8" })
            .split(/\r?\n/)
            .map((tag) => tag.trim())
            .filter((tag) => /^v\d+\.\d+\.\d+$/.test(tag));
          if (tags.length === 0) {
            console.error("No vX.Y.Z tag found");
            process.exit(1);
          }
          const parse = (tag) => tag.slice(1).split(".").map(Number);
          tags.sort((a, b) => {
            const pa = parse(a);
            const pb = parse(b);
            for (let i = 0; i < 3; i += 1) {
              if (pa[i] !== pb[i]) return pa[i] - pb[i];
            }
            return 0;
          });
          const latest = tags[tags.length - 1];
          const [major, minor, patch] = parse(latest);
          const version = major + "." + minor + "." + (patch + 1);
          console.log("Next version v" + version + " (from " + latest + ")");
          const setJsonVersion = (path) => {
            const text = fs.readFileSync(path, "utf8");
            const updated = text.replace(/"version": "[^"]+"/, "\"version\": \"" + version + "\"");
            if (updated === text) {
              console.error("version field not found in " + path);
              process.exit(1);
            }
            fs.writeFileSync(path, updated);
          };
          setJsonVersion("apps/desktop/package.json");
          setJsonVersion("apps/desktop/src-tauri/tauri.conf.json");
          const cargoPath = "apps/desktop/src-tauri/Cargo.toml";
          const cargo = fs.readFileSync(cargoPath, "utf8");
          const updatedCargo = cargo.replace(/^version = "[^"]+"/m, "version = \"" + version + "\"");
          if (updatedCargo === cargo) {
            console.error("version field not found in Cargo.toml");
            process.exit(1);
          }
          fs.writeFileSync(cargoPath, updatedCargo);
          '
      
      - name: Build desktop app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd apps/desktop
          pnpm tauri build --target ${{ matrix.target }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gteam-${{ matrix.platform }}-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/

  docker-server:
    name: Docker server image
    needs: [changes]
    if: always() && !cancelled() && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f apps/server/Dockerfile .

  release:
    name: Publish Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            if git tag --points-at "${GITHUB_SHA}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Commit already has a v* tag; skipping release"
              exit 0
            fi
            latest=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [ -z "${latest}" ]; then
              echo "No vX.Y.Z tag found" >&2
              exit 1
            fi
            ver=${latest#v}
            major=${ver%%.*}
            minor=${ver#*.}
            minor=${minor%%.*}
            patch=${ver##*.}
            tag="v${major}.${minor}.$((patch + 1))"
            echo "Creating ${tag} from ${latest}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          node .github/scripts/release-updater.mjs stage \
            --dist dist \
            --out release-assets \
            --manifest updater-platforms.json

          shopt -s nullglob
          files=(release-assets/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no release assets" >&2
            exit 1
          fi

          if gh release view "$tag" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" -R "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              -R "${GITHUB_REPOSITORY}" \
              --target "${{ github.sha }}" \
              --title "gteam ${tag}" \
              --generate-notes
          fi

          gh release view "$tag" -R "${GITHUB_REPOSITORY}" --json body --jq '.body // ""' > release-notes.txt
          node .github/scripts/release-updater.mjs latest \
            --manifest updater-platforms.json \
            --version "${tag#v}" \
            --notes-file release-notes.txt \
            --tag "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --out latest.json
          gh release upload "$tag" latest.json -R "${GITHUB_REPOSITORY}" --clobber
