[package]
name = "gteam"
version = "0.1.0"
description = "gteam (God Team): AI-first team context hub"
authors = ["Hunter (ncwtf)"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6.1"
git2 = { version = "0.18", default-features = false, features = ["vendored-openssl", "vendored-libgit2"] }
keyring = "2.3"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
